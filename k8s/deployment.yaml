apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflowqueue-api
  namespace: workflowqueue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workflowqueue-api
  template:
    metadata:
      labels:
        app: workflowqueue-api
    spec:
      containers:
      - name: api
        image: workflowqueue-api:latest
        ports:
        - containerPort: 4100
---
apiVersion: v1
kind: Service
metadata:
  name: workflowqueue-api
  namespace: workflowqueue
spec:
  selector:
    app: workflowqueue-api
  ports:
  - port: 4100
    targetPort: 4100
