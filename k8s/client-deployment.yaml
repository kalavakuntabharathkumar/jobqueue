apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflowqueue-client
  namespace: workflowqueue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflowqueue-client
  template:
    metadata:
      labels:
        app: workflowqueue-client
    spec:
      containers:
      - name: client
        image: workflowqueue-client:latest
        ports:
        - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: workflowqueue-client
  namespace: workflowqueue
spec:
  selector:
    app: workflowqueue-client
  ports:
  - port: 5173
    targetPort: 5173
